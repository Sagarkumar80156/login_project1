<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page with Local Storage</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; font-family: Arial, sans-serif;
      background: #f2f4f8;
    }
    .login-container {
      width: 320px; padding: 30px; background: white; text-align: center;
      border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    h2 { margin: 0 0 20px; color: #222; }
    input {
      width: 100%; padding: 12px; margin: 9px 0;
      border: 1px solid #ccd2dc; border-radius: 6px; font-size: 14px;
    }
    button {
      width: 100%; padding: 12px; margin-top: 10px; border: 0;
      border-radius: 6px; background: #2457d6; color: white;
      font-size: 15px; cursor: pointer;
    }
    button:hover { background: #183fa5; }
    #message { min-height: 20px; margin: 16px 0 0; font-weight: bold; }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login Form</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Enter Email" required>
      <input type="password" id="password" placeholder="Enter Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="message" aria-live="polite"></p>
  </div>

  <script>
    // Demo account saved in localStorage.
    // For a real app, never store plain-text passwords in localStorage.
    if (localStorage.getItem("email") === null) {
      localStorage.setItem("email", "user@gmail.com");
      localStorage.setItem("password", "12345");
    }

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const savedEmail = localStorage.getItem("email");
      const savedPassword = localStorage.getItem("password");

      if (email === savedEmail && password === savedPassword) {
        message.textContent = "Login Successful";
        message.style.color = "green";
      } else {
        message.textContent = "Invalid email or password";
        message.style.color = "red";
      }
    });
  </script>
</body>
</html>
